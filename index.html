<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>军工武器溯源信息查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f0f2f5;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #1a365d;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .info-item {
            margin-bottom: 20px;
            line-height: 1.8;
        }
        .info-item strong {
            color: #2d3748;
            min-width: 120px;
            display: inline-block;
        }
        .timeline {
            margin: 20px 0;
            padding-left: 20px;
            border-left: 2px solid #4299e1;
        }
        .timeline-item {
            margin-bottom: 15px;
            position: relative;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -26px;
            top: 5px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #4299e1;
        }
        .conclusion {
            background-color: #f0fff4;
            padding: 15px;
            border-radius: 8px;
            color: #22543d;
            border-left: 4px solid #48bb78;
        }
        .error {
            text-align: center;
            color: #718096;
            padding: 50px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>军工武器溯源信息查询</h1>
        <div id="content" class="error">数据加载中...</div>
    </div>

    <script>
        // 1. 读取URL参数中的id
        const urlParams = new URLSearchParams(window.location.search);
        const targetId = parseInt(urlParams.get('id')) || 1;

        // 2. 读取JSON数据
        fetch('./data.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('文件加载失败，请检查文件路径');
                }
                return response.json();
            })
            .then(data => {
                // 3. 查找对应id的装备数据
                const weapon = data.find(item => item.id === targetId);
                if (!weapon) {
                    document.getElementById('content').innerHTML = `
                        <div class="error">未找到该装备的溯源信息，请检查查询ID</div>
                    `;
                    return;
                }

                // 4. 渲染页面
                document.getElementById('content').innerHTML = `
                    <div class="info-item"><strong>装备名称：</strong>${weapon.productName}</div>
                    <div class="info-item"><strong>产品编号：</strong>${weapon.productCode}</div>
                    <div class="info-item"><strong>生产批次：</strong>${weapon.batch}</div>
                    <div class="info-item"><strong>生产基地：</strong>${weapon.origin}</div>
                    <div class="info-item"><strong>生产日期：</strong>${weapon.produceDate}</div>
                    <div class="info-item"><strong>检测结果：</strong>${weapon.testResult}</div>
                    
                    <h3 style="margin: 30px 0 15px; color: #1a365d;">物流时间线</h3>
                    <div class="timeline">
                        ${weapon.logisticsTimeline.map(item => `
                            <div class="timeline-item">
                                <strong>${item.time}</strong>
                                <p>${item.content}</p>
                            </div>
                        `).join('')}
                    </div>
                    
                    <h3 style="margin: 30px 0 15px; color: #1a365d;">溯源结论</h3>
                    <div class="conclusion">${weapon.traceConclusion}</div>
                `;
            })
            .catch(error => {
                console.error('加载错误：', error);
                document.getElementById('content').innerHTML = `
                    <div class="error">数据加载失败，请检查文件路径或网络连接</div>
                `;
            });
    </script>
</body>
</html>
